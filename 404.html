<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#FBFAF7">
<link rel="icon" type="image/png" href="https://gsnxtstesvysesgbxnwr.supabase.co/storage/v1/object/public/campaign-media/1-01.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<title>Page Not Found — BarChata</title>
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#FBFAF7;color:#16150F;font-family:'Inter',sans-serif;line-height:1.75;font-size:16px;-webkit-font-smoothing:antialiased}
nav{position:sticky;top:0;z-index:100;background:rgba(251,250,247,0.9);backdrop-filter:blur(16px);border-bottom:1px solid #E8E6DF;height:68px;display:flex;align-items:center;padding:0 2rem}
.nav-inner{max-width:1160px;margin:0 auto;width:100%;display:flex;align-items:center;justify-content:space-between}
.nav-brand{display:flex;align-items:center;gap:10px;font-family:'DM Sans',sans-serif;font-weight:700;font-size:21px;letter-spacing:-0.02em;color:#16150F;text-decoration:none}
.nav-brand img{width:30px;height:30px;object-fit:contain}
.nav-links{display:flex;gap:24px;align-items:center}
.nav-links a{font-size:14px;font-weight:500;color:#6E6C64;text-decoration:none}
.nav-links a:hover{color:#16150F}
.nav-cta{background:#F27D26;color:#fff!important;padding:9px 22px;border-radius:9px;font-weight:600;font-size:14px}
.nav-cta:hover{filter:brightness(1.08)}
main{max-width:760px;margin:0 auto;padding:3.5rem 2rem 5rem}
h1{font-family:'DM Sans',sans-serif;font-size:clamp(32px,5vw,48px);font-weight:700;letter-spacing:-0.03em;margin-bottom:8px;color:#16150F}
.updated{color:#A5A39B;font-size:13px;margin-bottom:3rem}
h2{font-family:'DM Sans',sans-serif;font-size:20px;font-weight:700;color:#F27D26;margin-top:2.5rem;margin-bottom:0.75rem;letter-spacing:-0.01em}
p{color:#6E6C64;font-size:15px;margin-bottom:1rem}
ul{color:#6E6C64;font-size:15px;margin:0 0 1rem 1.25rem}
li{margin-bottom:6px}
a{color:#F27D26;text-decoration:none}
a:hover{text-decoration:underline}
footer{border-top:1px solid #E8E6DF;max-width:760px;margin:0 auto;padding:2rem;text-align:center}
footer p{color:#A5A39B;font-size:12px;margin:4px 0 0}
.f-inner{display:flex;gap:12px;justify-content:center;align-items:center;margin-bottom:4px}
.f-inner a{font-size:13px;color:#6E6C64}
.f-inner span{color:#D8D6CE;font-size:10px}
@media(max-width:600px){nav .nav-links a:not(.nav-cta){display:none}}
.error-page{min-height:calc(100vh - 68px);display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem}
.error-page h1{font-size:clamp(80px,15vw,160px);color:#F4F2EC;margin-bottom:0;line-height:1}
.error-page h2{font-family:'DM Sans',sans-serif;font-size:28px;font-weight:700;color:#16150F;margin-top:0.5rem;margin-bottom:0.75rem;letter-spacing:-0.02em}
.error-page p{color:#6E6C64;font-size:16px;margin-bottom:2rem;max-width:420px;margin-left:auto;margin-right:auto}
.error-page .btn{display:inline-block;background:#F27D26;color:#fff;padding:13px 32px;border-radius:10px;font-weight:600;font-size:15px;text-decoration:none;transition:all 0.15s}
.error-page .btn:hover{filter:brightness(1.08);transform:translateY(-2px);text-decoration:none}
.error-links{display:flex;gap:24px;justify-content:center;margin-top:1.5rem}
.error-links a{font-size:14px;color:#6E6C64;text-decoration:none}
.error-links a:hover{color:#F27D26}
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="/" class="nav-brand">
      <img src="https://gsnxtstesvysesgbxnwr.supabase.co/storage/v1/object/public/campaign-media/1-01.png" alt="BarChata">
      BarChata
    </a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="https://biz.barchata.com/directory">Directory</a>
      <a href="https://biz.barchata.com" class="nav-cta">List free</a>
    </div>
  </div>
</nav>
<div class="error-page">
  <div>
    <h1>404</h1>
    <h2>Page not found</h2>
    <p>The page you&rsquo;re looking for doesn&rsquo;t exist or has been moved. Let&rsquo;s get you back on track.</p>
    <a href="/" class="btn">Back to BarChata</a>
    <div class="error-links">
      <a href="https://biz.barchata.com/directory">Browse directory</a>
      <a href="https://biz.barchata.com">List your business</a>
      <a href="mailto:jdigos@barchata.com">Contact us</a>
    </div>
  </div>
</div>
</body>
</html>
