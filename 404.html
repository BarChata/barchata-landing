<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Redirecting...</title>
<script>
  var path = window.location.pathname;
  var lower = path.toLowerCase();
  if (path !== lower) {
    window.location.replace(window.location.origin + lower + window.location.search + window.location.hash);
  } else {
    window.location.replace('/');
  }
</script>
</head>
<body>
<p>Redirecting...</p>
</body>
</html>
