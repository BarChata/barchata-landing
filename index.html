<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>BarChata — The Rewards Ecosystem for Social Engagement</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bk:#1A1A1A;--nk:#222222;--s2:#2A2A2A;--s3:#333333;--s4:#3D3D3D;
  --or:#E8621A;--or-l:#FF7A30;--or-d:#C04E10;--gold:#C9A84C;--gold-l:#E8C96A;
  --og:rgba(232,98,26,.12);--bdo:rgba(232,98,26,.3);--bdg:rgba(201,168,76,.2);
  --tp:#FFFFFF;--ts:rgba(255,255,255,.72);--tm:rgba(255,255,255,.45);--td:rgba(255,255,255,.25);
  --bd:rgba(255,255,255,.1);--bdo2:rgba(232,98,26,.35);--nh:68px;
}
html{scroll-behavior:smooth;}
body{background:var(--bk);color:var(--tp);font-family:'DM Sans',sans-serif;font-weight:400;overflow-x:hidden;line-height:1.6;}
@media(pointer:fine){body{cursor:none;}#cur,#cur-r{position:fixed;top:0;left:0;pointer-events:none;border-radius:50%;transform:translate(-50%,-50%);}#cur{width:8px;height:8px;background:var(--or);z-index:9999;mix-blend-mode:normal;}#cur-r{width:30px;height:30px;border:1.5px solid rgba(232,98,26,.5);z-index:9998;transition:transform .35s cubic-bezier(.23,1,.32,1);}}
nav{position:fixed;top:0;left:0;right:0;z-index:100;height:var(--nh);padding:0 48px;display:flex;align-items:center;background:rgba(26,26,26,.97);border-bottom:1px solid var(--bd);backdrop-filter:blur(12px);}
.nl{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0;margin-right:auto;}
.nl-img{height:32px;width:auto;object-fit:contain;}
.nl-t{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:600;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;white-space:nowrap;}
.nlinks{display:flex;align-items:center;list-style:none;height:100%;}
.nlinks li a{display:flex;align-items:center;height:var(--nh);padding:0 16px;font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ts);text-decoration:none;transition:color .2s;white-space:nowrap;}
.nlinks li a:hover{color:var(--or-l);}
.ncta{flex-shrink:0;margin-left:8px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:var(--or);padding:0 24px;height:42px;line-height:42px;text-decoration:none;transition:background .2s;display:inline-block;white-space:nowrap;border-radius:3px;}
.ncta:hover{background:var(--or-l);}
.nbg{display:none;flex-direction:column;gap:5px;cursor:pointer;margin-left:16px;padding:5px;background:none;border:none;}
.nbg span{display:block;width:20px;height:1.5px;background:var(--ts);transition:all .3s;transform-origin:center;}
.nbg.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg);}
.nbg.open span:nth-child(2){opacity:0;}
.nbg.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg);}
.nmob{display:none;position:fixed;top:var(--nh);left:0;right:0;background:rgba(26,26,26,.99);border-bottom:1px solid var(--bd);max-height:0;overflow:hidden;transition:max-height .4s ease;z-index:99;}
.nmob.open{max-height:500px;}
.nmob a{display:block;padding:14px 28px;font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--ts);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.06);transition:color .2s,background .2s;}
.nmob a:hover{color:var(--or-l);background:rgba(232,98,26,.06);}
.nmob .mc{color:#fff;background:var(--or);margin:16px 28px;padding:13px 24px;display:inline-block;border-bottom:none;border-radius:3px;}
@media(max-width:900px){nav{padding:0 20px;}.nlinks,.ncta{display:none;}.nbg{display:flex;}.nmob{display:block;}}
#hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:calc(var(--nh)+72px) 24px 64px;text-align:center;}
.hbg{position:absolute;inset:0;background:radial-gradient(ellipse 55% 45% at 50% 55%,rgba(232,98,26,.1) 0%,transparent 65%),radial-gradient(ellipse 30% 30% at 15% 25%,rgba(201,168,76,.06) 0%,transparent 60%),radial-gradient(ellipse 25% 25% at 85% 75%,rgba(232,98,26,.06) 0%,transparent 60%);background-color:var(--bk);}
.hgrid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:72px 72px;mask-image:radial-gradient(ellipse 75% 75% at 50% 50%,black 0%,transparent 100%);}
.hlk{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:32px;opacity:0;animation:fU .9s ease .1s forwards;}
.hlk-img{height:76px;width:auto;object-fit:contain;filter:drop-shadow(0 6px 28px rgba(232,98,26,.35));}
.hlk-n{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.5em;text-transform:uppercase;color:var(--gold);opacity:.7;}
.ey{font-size:9.5px;letter-spacing:.35em;text-transform:uppercase;color:var(--or);margin-bottom:20px;opacity:0;animation:fU .9s ease .28s forwards;}
.ey::before,.ey::after{content:'—';margin:0 9px;opacity:.4;}
h1{font-family:'Cormorant Garamond',serif;font-size:clamp(46px,8.5vw,104px);font-weight:300;line-height:.92;letter-spacing:-.01em;color:var(--tp);opacity:0;animation:fU 1.1s ease .42s forwards;max-width:820px;}
h1 em{font-style:italic;color:var(--gold);}
h1 strong{font-weight:300;color:var(--or-l);}
.hsub{font-size:15px;font-weight:400;color:var(--ts);letter-spacing:.02em;line-height:1.72;max-width:500px;margin-top:24px;opacity:0;animation:fU .9s ease .62s forwards;}
.hcall{margin-top:36px;display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;animation:fU .9s ease .78s forwards;}
.hcall-lbl{font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--tm);}
.dbtn{display:inline-flex;align-items:center;gap:11px;background:var(--or);color:#fff;font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;padding:16px 40px;text-decoration:none;transition:all .25s;border-radius:3px;}
.dbtn:hover{background:var(--or-l);transform:translateY(-2px);box-shadow:0 10px 36px rgba(232,98,26,.35);}
.dbtn svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.hseclinks{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px;}
.hseclinks a{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--tm);text-decoration:none;padding:7px 16px;border:1px solid rgba(255,255,255,.12);transition:all .25s;border-radius:3px;}
.hseclinks a:hover{color:var(--or-l);border-color:var(--bdo2);}
.app-badges-wrap{margin-top:24px;display:flex;flex-direction:column;align-items:center;gap:9px;opacity:0;animation:fU .9s ease 1.05s forwards;}
.app-avail-lbl{font-size:8.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--td);}
.app-badges{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;}
.app-badge{text-decoration:none;transition:opacity .2s,transform .2s;display:inline-block;}
.app-badge:hover{opacity:.82;transform:translateY(-2px);}
.sclhint{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:7px;opacity:0;animation:fI .9s ease 1.5s forwards;}
.sclhint span{font-size:8px;letter-spacing:.3em;text-transform:uppercase;color:var(--td);}
.sline{width:1px;height:40px;background:linear-gradient(to bottom,var(--or),transparent);animation:sP 2s ease-in-out infinite;}
.statbar{background:var(--nk);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:26px 48px;display:flex;justify-content:center;}
.si{flex:1;max-width:220px;text-align:center;padding:0 28px;border-right:1px solid var(--bd);}
.si:last-child{border-right:none;}
.sn{font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:300;color:var(--or);line-height:1;}
.sl{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--tm);margin-top:6px;}
@media(max-width:600px){.statbar{padding:14px;flex-wrap:wrap;}.si{flex:1 1 50%;max-width:none;padding:12px 8px;border-right:none;border-bottom:1px solid var(--bd);}.si:nth-child(1),.si:nth-child(2){border-right:1px solid var(--bd);}.si:nth-child(3),.si:nth-child(4){border-bottom:none;}}
.sec{padding:88px 48px;max-width:1200px;margin:0 auto;}
.sec-bg{background:var(--nk);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);}
.se{font-size:9px;letter-spacing:.35em;text-transform:uppercase;color:var(--or);margin-bottom:16px;display:block;}
.st{font-family:'Cormorant Garamond',serif;font-size:clamp(30px,4.5vw,56px);font-weight:300;line-height:1.06;color:var(--tp);margin-bottom:14px;}
.st em{font-style:italic;color:var(--gold);}
.sd{font-size:14px;color:var(--ts);line-height:1.8;font-weight:400;max-width:480px;}
.gd{width:48px;height:2px;background:var(--or);margin:24px 0;border-radius:2px;}
@media(max-width:768px){.sec{padding:64px 20px;}}
#audience{background:var(--nk);}
.aud-hd{text-align:center;padding:72px 24px 44px;max-width:560px;margin:0 auto;}
.aud-hd h2{font-family:'Cormorant Garamond',serif;font-size:clamp(28px,4vw,46px);font-weight:300;color:var(--tp);line-height:1.1;margin-bottom:10px;}
.aud-hd p{font-size:13.5px;color:var(--ts);line-height:1.75;}
.aud-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--bd);}
.ac{background:var(--nk);padding:48px 32px 40px;display:flex;flex-direction:column;position:relative;overflow:hidden;transition:background .3s;text-decoration:none;}
.ac::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--or);transform:scaleX(0);transition:transform .35s;}
.ac:hover{background:var(--s2);}.ac:hover::after{transform:scaleX(1);}
.ac.primary{background:rgba(232,98,26,.07);border-left:1px solid var(--bdo2);border-right:1px solid var(--bdo2);}
.ac.primary::after{transform:scaleX(.5);opacity:.7;}.ac.primary:hover{background:rgba(232,98,26,.12);}
.acn{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:300;color:var(--or);opacity:.25;line-height:1;margin-bottom:20px;}
.aic{width:50px;height:50px;border:1.5px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;margin-bottom:18px;background:rgba(255,255,255,.04);transition:border-color .3s,background .3s;border-radius:4px;}
.ac:hover .aic,.ac.primary .aic{border-color:var(--or);background:rgba(232,98,26,.1);}
.aic svg{width:22px;height:22px;stroke:rgba(255,255,255,.5);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s;}
.ac:hover .aic svg,.ac.primary .aic svg{stroke:var(--or-l);}
.acw{font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:var(--or);margin-bottom:8px;font-weight:500;}
.act{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:400;color:var(--tp);margin-bottom:12px;line-height:1.2;}
.acd{font-size:12.5px;color:var(--ts);line-height:1.7;font-weight:400;flex:1;}
.acl{margin-top:22px;display:inline-flex;align-items:center;gap:6px;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--or);font-weight:600;transition:gap .2s;text-decoration:none;}
.acl svg{width:11px;height:11px;stroke:var(--or);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s;}
.ac:hover .acl svg{transform:translateX(4px);}
@media(max-width:860px){.aud-grid{grid-template-columns:1fr;}.ac{padding:32px 22px;}.ac.primary{border-left:none;border-right:none;border-top:1px solid var(--bdo2);border-bottom:1px solid var(--bdo2);}}
#cities{padding:80px 48px;background:var(--bk);border-top:1px solid var(--bd);}
.city-wrap{max-width:1100px;margin:0 auto;}
.city-hd{text-align:center;margin-bottom:44px;}
.city-tabs{display:flex;justify-content:center;gap:1px;background:var(--bd);border:1px solid var(--bd);margin-bottom:36px;border-radius:4px;overflow:hidden;}
.ctab{flex:1;max-width:200px;padding:14px 20px;text-align:center;background:var(--nk);cursor:pointer;transition:background .2s;border:none;color:var(--ts);}
.ctab.active{background:var(--or);color:#fff;}
.ctab-name{font-size:12px;font-weight:600;letter-spacing:.08em;display:block;margin-bottom:2px;}
.ctab-sub{font-size:9px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;}
.city-panel{display:none;}.city-panel.active{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--bd);border:1px solid var(--bd);}
.cv{background:var(--nk);padding:24px 20px;display:flex;align-items:center;gap:14px;text-decoration:none;transition:background .25s;position:relative;overflow:hidden;}
.cv:hover{background:var(--s2);}
.cv::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--or);transform:scaleY(0);transition:transform .25s;transform-origin:bottom;}
.cv:hover::before{transform:scaleY(1);}
.cv-ico{width:42px;height:42px;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--s2);border-radius:4px;}
.cv-ico svg{width:17px;height:17px;stroke:var(--or);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.cv-name{font-size:13px;font-weight:600;color:var(--tp);margin-bottom:2px;}
.cv-type{font-size:10px;color:var(--tm);letter-spacing:.06em;}
.cv-pts{margin-left:auto;font-size:11px;color:var(--or);display:flex;align-items:center;gap:3px;flex-shrink:0;font-weight:600;}
.cv-pts svg{width:10px;height:10px;fill:var(--or);}
.city-cta{text-align:center;margin-top:24px;}
@media(max-width:860px){.city-panel.active{grid-template-columns:1fr 1fr;}}
@media(max-width:520px){.city-panel.active{grid-template-columns:1fr;}.city-tabs{flex-direction:column;}.ctab{max-width:none;}}
@media(max-width:768px){#cities{padding:60px 20px;}}
#directory{background:var(--bk);}
.dirsplit{display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:center;}
.dfs{display:flex;flex-direction:column;gap:0;}
.df{display:flex;align-items:flex-start;gap:14px;padding:16px 0;border-bottom:1px solid var(--bd);}
.df:first-child{padding-top:0;}.df:last-child{border-bottom:none;}
.dfd{width:7px;height:7px;border-radius:50%;background:var(--or);margin-top:5px;flex-shrink:0;}
.dft h4{font-size:13px;font-weight:600;color:var(--tp);margin-bottom:3px;}
.dft p{font-size:12.5px;color:var(--ts);line-height:1.6;}
.mockbr{background:var(--nk);border:1px solid var(--bd);overflow:hidden;border-radius:8px;}
.mbr-top{background:var(--s2);padding:12px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:7px;}
.mbr-dot{width:10px;height:10px;border-radius:50%;}
.mbr-url{font-size:9.5px;color:var(--tm);letter-spacing:.05em;margin-left:6px;background:var(--s3);padding:4px 12px;border-radius:20px;flex:1;text-align:center;}
.mbr-body{padding:18px;}
.mbr-lbl{font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--or);margin-bottom:10px;font-weight:600;}
.vrow{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07);}
.vrow:last-of-type{border-bottom:none;}
.vthumb{width:36px;height:36px;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--s3);border-radius:4px;}
.vthumb svg{width:14px;height:14px;stroke:var(--or);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.vname{font-size:12.5px;font-weight:600;color:var(--tp);margin-bottom:1px;}
.vtag{font-size:9.5px;color:var(--tm);letter-spacing:.06em;}
.vhrt{margin-left:auto;font-size:10.5px;color:var(--or);display:flex;align-items:center;gap:3px;font-weight:600;}
.vhrt svg{width:9px;height:9px;fill:var(--or);}
.mcta-row{margin-top:14px;display:flex;gap:8px;}
.mbtn-p{background:var(--or);color:#fff;font-size:9px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;padding:10px 16px;text-decoration:none;transition:background .2s;display:inline-block;border-radius:3px;}
.mbtn-p:hover{background:var(--or-l);}
.mbtn-g{border:1px solid var(--bd);color:var(--ts);font-size:9px;letter-spacing:.16em;text-transform:uppercase;padding:10px 16px;text-decoration:none;transition:all .2s;display:inline-block;border-radius:3px;}
.mbtn-g:hover{border-color:var(--bdo2);color:var(--or-l);}
@media(max-width:860px){.dirsplit{grid-template-columns:1fr;gap:40px;}.mockbr{display:none;}}
#howitworks{background:var(--nk);}
.hiw-inner{max-width:1100px;margin:0 auto;}
.hiw-hd{text-align:center;margin-bottom:52px;}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--bd);border:1px solid var(--bd);}
.step{background:var(--nk);padding:40px 28px;position:relative;}
.step:hover{background:var(--s2);}
.step-n{font-family:'Cormorant Garamond',serif;font-size:52px;font-weight:300;color:var(--or);opacity:.25;line-height:1;margin-bottom:18px;}
.step-ico{width:48px;height:48px;border:1.5px solid var(--bdo2);display:flex;align-items:center;justify-content:center;margin-bottom:18px;background:rgba(232,98,26,.08);border-radius:4px;}
.step-ico svg{width:22px;height:22px;stroke:var(--or);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.step-title{font-size:14px;font-weight:600;color:var(--tp);letter-spacing:.04em;margin-bottom:10px;}
.step-desc{font-size:12.5px;color:var(--ts);line-height:1.7;}
.step-arr{position:absolute;top:50%;right:-1px;transform:translateY(-50%);width:22px;height:22px;background:var(--s2);border:1.5px solid var(--bdo2);display:flex;align-items:center;justify-content:center;z-index:2;border-radius:50%;}
.step-arr::after{content:'›';color:var(--or);font-size:15px;line-height:1;font-weight:700;}
.step:last-child .step-arr{display:none;}
@media(max-width:768px){.steps{grid-template-columns:1fr;}.step-arr{display:none;}}
#loyalty{background:var(--bk);}
.loy{display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:center;}
.feat-list{display:flex;flex-direction:column;gap:0;margin-top:32px;}
.fi{display:flex;align-items:flex-start;gap:14px;padding:16px 0;border-bottom:1px solid var(--bd);}
.fi:first-child{padding-top:0;}.fi:last-child{border-bottom:none;padding-bottom:0;}
.fi-n{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:600;color:var(--or);min-width:28px;line-height:1.4;}
.fi-t h4{font-size:13px;font-weight:600;color:var(--tp);letter-spacing:.03em;margin-bottom:4px;}
.fi-t p{font-size:12.5px;color:var(--ts);line-height:1.65;}
.hvis{position:relative;height:280px;display:flex;align-items:center;justify-content:center;}
.hr{position:absolute;border-radius:50%;border:1px solid rgba(232,98,26,.18);animation:rot 20s linear infinite;}
.hr1{width:268px;height:268px;border-color:rgba(201,168,76,.1);animation-duration:30s;animation-direction:reverse;}
.hr2{width:206px;height:206px;animation-duration:20s;}
.hr3{width:146px;height:146px;border-style:dashed;border-color:rgba(201,168,76,.15);animation-duration:14s;animation-direction:reverse;}
.hr4{width:92px;height:92px;border-color:rgba(232,98,26,.3);animation-duration:9s;}
.hc{width:70px;height:70px;background:var(--or);border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:2;box-shadow:0 0 32px rgba(232,98,26,.4);}
.hc svg{width:28px;height:28px;fill:#fff;}
.od{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--or);box-shadow:0 0 10px rgba(232,98,26,.8);}
.od.g{background:var(--gold);box-shadow:0 0 10px rgba(201,168,76,.7);}
@media(max-width:768px){#loyalty .sec{padding:64px 20px;}.loy{grid-template-columns:1fr;gap:44px;}.hvis{height:200px;}.hr1{width:188px;height:188px;}.hr2{width:146px;height:146px;}.hr3{width:104px;height:104px;}.hr4{width:66px;height:66px;}.hc{width:52px;height:52px;}.hc svg{width:22px;height:22px;}}
#barstars{background:var(--nk);}
.bs-inner{max-width:1200px;margin:0 auto;}
.bs-hd{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:36px;gap:20px;flex-wrap:wrap;}
.bs-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--bd);border:1px solid var(--bd);}
.bsc{background:var(--nk);padding:26px 22px;transition:background .25s;cursor:pointer;}
.bsc:hover{background:var(--s2);}
.bsc-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;margin-bottom:14px;font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;border-radius:3px;}
.bsc-badge.sponsor{background:rgba(232,98,26,.15);color:var(--or);border:1px solid var(--bdo2);}
.bsc-badge.gold{background:rgba(201,168,76,.12);color:var(--gold);border:1px solid rgba(201,168,76,.3);}
.bsc-badge.silver{background:rgba(255,255,255,.06);color:var(--ts);border:1px solid var(--bd);}
.bsc-name{font-family:'Cormorant Garamond',serif;font-size:21px;font-weight:400;color:var(--tp);margin-bottom:3px;}
.bsc-type{font-size:10px;color:var(--tm);letter-spacing:.09em;margin-bottom:14px;}
.bsc-stats{display:flex;align-items:center;justify-content:space-between;}
.bsc-hrt{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--or);font-weight:600;}
.bsc-hrt svg{width:11px;height:11px;fill:var(--or);}
.bsc-city{font-size:9px;color:var(--tm);letter-spacing:.1em;text-transform:uppercase;}
@media(max-width:860px){.bs-cards{grid-template-columns:1fr 1fr;}}
@media(max-width:520px){.bs-cards{grid-template-columns:1fr;}.bs-hd{flex-direction:column;align-items:flex-start;}}
#platforms{background:var(--bk);}
.platgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--bd);margin-top:48px;border:1px solid var(--bd);}
.pc{background:var(--nk);padding:38px 28px;position:relative;overflow:hidden;transition:background .3s;text-decoration:none;display:block;}
.pc::before{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--or);transform:scaleX(0);transition:transform .35s;}
.pc:hover{background:var(--s2);}.pc:hover::before{transform:scaleX(1);}
.pcic{width:46px;height:46px;border:1.5px solid rgba(255,255,255,.13);display:flex;align-items:center;justify-content:center;margin-bottom:20px;background:rgba(255,255,255,.04);transition:border-color .3s,background .3s;border-radius:4px;}
.pc:hover .pcic{border-color:var(--or);background:rgba(232,98,26,.1);}
.pcic svg{width:21px;height:21px;stroke:rgba(255,255,255,.5);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s;}
.pc:hover .pcic svg{stroke:var(--or-l);}
.pctg{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--tm);margin-bottom:7px;font-weight:500;}
.pcti{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:400;color:var(--tp);margin-bottom:10px;}
.pcd{font-size:12.5px;color:var(--ts);line-height:1.7;}
.pcar{position:absolute;bottom:28px;right:28px;font-size:18px;color:var(--or);opacity:0;transform:translateX(-6px);transition:all .3s;font-weight:700;}
.pc:hover .pcar{opacity:1;transform:translateX(0);}
.pc-full{grid-column:1/-1;display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:26px;padding:26px 30px;}
.pc-full .pcic{margin-bottom:0;flex-shrink:0;}
.pc-full .pcar{position:static;opacity:1;transform:none;font-size:18px;}
@media(max-width:860px){.platgrid{grid-template-columns:1fr 1fr;}.pc-full{grid-template-columns:1fr;gap:14px;padding:22px 20px;}.pc-full .pcar{display:none;}}
@media(max-width:520px){.platgrid{grid-template-columns:1fr;}.pc{padding:28px 20px;}}
#barcash{background:var(--nk);}
.bc-inner{display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:center;}
.tbadge{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--bdo2);padding:6px 14px;margin-bottom:18px;border-radius:3px;}
.tdot{width:6px;height:6px;background:var(--or);border-radius:50%;animation:pulse 2s ease-in-out infinite;}
.tlbl{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--or);font-weight:600;}
.caddr{font-family:'Courier New',monospace;font-size:10px;color:var(--ts);letter-spacing:.05em;padding:12px 14px;border:1px solid var(--bd);background:rgba(255,255,255,.04);word-break:break-all;margin-top:16px;border-radius:4px;}
.hxg{display:grid;grid-template-columns:repeat(5,36px);gap:4px;}
.hx{width:36px;height:36px;background:var(--s3);border:1px solid var(--bd);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);animation:hxP var(--d,3s) ease-in-out infinite var(--dl,0s);}
.hx.a{background:rgba(232,98,26,.18);border-color:rgba(232,98,26,.4);}
@media(max-width:768px){.bc-inner{grid-template-columns:1fr;gap:44px;}}
#wc-banner{padding:0 48px;background:var(--bk);}
.wcb{max-width:1200px;margin:0 auto;border:1.5px solid var(--bdo2);background:rgba(232,98,26,.06);padding:32px 44px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;border-radius:6px;}
.wcb-left{display:flex;align-items:center;gap:18px;}
.wcb-icon{width:46px;height:46px;border:1.5px solid var(--bdo2);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:rgba(232,98,26,.1);border-radius:4px;}
.wcb-icon svg{width:22px;height:22px;stroke:var(--or);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
.wcb-label{font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--or);margin-bottom:4px;font-weight:600;}
.wcb-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;color:var(--tp);}
.countdown{display:flex;gap:20px;}
.cd-unit{text-align:center;}
.cd-n{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:300;color:var(--or);line-height:1;min-width:52px;}
.cd-l{font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--tm);margin-top:4px;}
@media(max-width:700px){#wc-banner{padding:0 20px;}.wcb{padding:24px 20px;flex-direction:column;align-items:flex-start;}.countdown{gap:14px;}}
#barads{background:var(--bk);}
.ba-split{display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:start;margin-top:44px;}
.tierlist{display:flex;flex-direction:column;gap:1px;background:var(--bd);border:1px solid var(--bd);margin-top:28px;border-radius:4px;overflow:hidden;}
.tier{padding:16px 20px;background:var(--nk);display:flex;align-items:center;gap:14px;transition:background .2s;}
.tier:hover{background:var(--s2);}
.tst{color:var(--gold);font-size:11px;min-width:36px;font-weight:600;}
.tn{font-size:12.5px;font-weight:600;color:var(--tp);margin-bottom:2px;}
.td2{font-size:11.5px;color:var(--ts);line-height:1.5;}
.ba-verts{display:flex;flex-direction:column;gap:10px;}
.bav{padding:20px 22px;background:var(--nk);border:1px solid var(--bd);transition:border-color .2s;border-radius:4px;}
.bav:hover{border-color:var(--bdo2);}
.bav-tag{font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--or);margin-bottom:7px;font-weight:600;display:block;}
.bav-txt{font-size:12.5px;color:var(--ts);line-height:1.62;}
@media(max-width:768px){.ba-split{grid-template-columns:1fr;gap:40px;}}
#ticker{background:var(--nk);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);padding:18px 0;overflow:hidden;}
.ticker-track{display:flex;gap:0;animation:tick 28s linear infinite;white-space:nowrap;}
.ticker-item{display:inline-flex;align-items:center;gap:8px;padding:0 28px;border-right:1px solid var(--bd);flex-shrink:0;}
.ticker-item svg{width:10px;height:10px;fill:var(--or);flex-shrink:0;}
.ticker-item span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--tm);}
.ticker-item strong{color:var(--or);font-weight:600;}
footer{border-top:1px solid var(--bd);background:var(--nk);}
.ft-top{max-width:1200px;margin:0 auto;padding:52px 48px 36px;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:36px;align-items:start;}
.ft-logo{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.ft-logo-img{height:30px;width:auto;object-fit:contain;}
.ft-logo-t{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;}
.ft-tag{font-size:11px;color:var(--tm);line-height:1.65;letter-spacing:.02em;max-width:220px;margin-bottom:18px;}
.social-links{display:flex;flex-direction:column;gap:9px;margin-top:10px;}
.soc-link{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--tm);font-size:11px;letter-spacing:.09em;transition:color .2s;}
.soc-link:hover{color:var(--or-l);}
.ftc-lbl{font-size:8.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--or);display:block;margin-bottom:14px;font-weight:600;}
.ftc a{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--tm);text-decoration:none;margin-bottom:10px;transition:color .2s;}
.ftc a:hover{color:var(--or-l);}
.ft-app{margin-top:18px;}
.ft-app .app-avail-lbl{font-size:8.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--td);display:block;margin-bottom:10px;}
.ft-app .app-badges{display:flex;flex-direction:column;gap:7px;}
.ft-btm{border-top:1px solid var(--bd);padding:16px 48px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.ft-copy{font-size:9.5px;color:var(--td);letter-spacing:.08em;}
.ft-hrt{font-size:9.5px;color:var(--td);display:flex;align-items:center;gap:5px;}
.ft-hrt svg{width:10px;height:10px;fill:var(--or);}
@media(max-width:1000px){.ft-top{grid-template-columns:1fr 1fr;padding:36px 22px 24px;gap:28px;}.ft-brand{grid-column:1/-1;}.ft-btm{padding:14px 22px;}}
@media(max-width:480px){.ft-top{grid-template-columns:1fr;}}
.rv{opacity:0;transform:translateY(20px);transition:opacity .7s ease,transform .7s ease;}
.rv.d1{transition-delay:.1s;}.rv.d2{transition-delay:.2s;}.rv.d3{transition-delay:.3s;}
.rv.on{opacity:1;transform:translateY(0);}
@keyframes fU{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes fI{from{opacity:0;}to{opacity:1;}}
@keyframes sP{0%,100%{opacity:.3;}50%{opacity:1;}}
@keyframes rot{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.4;transform:scale(.75);}}
@keyframes hxP{0%,100%{opacity:.28;}50%{opacity:1;}}
@keyframes tick{from{transform:translateX(0);}to{transform:translateX(-50%);}}
</style>
</head>
